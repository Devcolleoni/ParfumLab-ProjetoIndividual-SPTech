<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver Avaliações</title>
  <link rel="stylesheet" href="../css/centro.css">

</head>

<body>

  <div class="sidebar">
    <div class="logo-container">
      <div class="logotipo">PARFUM LAB</div>
      <div class="logo-subtitulo">Avaliações</div>
    </div>

    <div class="saudacao">
      Olá, <strong id="nomeUsuario"></strong>!
    </div>

    <div class="menu">
      <a href="../index.html">Inicio</a>
      <a href="perfumes..html">Perfumes</a>
      <a href="avaliarPerfumes.html">Avaliar Fragrância</a>
      <a href="verAvaliacao.html" class="ativo">Ver Avaliações</a>
      <a href="dashboard.html">Dashboard</a>
    </div>

    <button onclick="sair()" class="sair">Sair</button>
  </div>


  <div class="conteudo-central">
    <h1>Todas as Avaliações</h1>
    <p class="descricao">Veja o que os usuários acharam dos perfumes</p>


    <div class="filtro">
      <button class="filtro-btn ativo" onclick="filtrarTodas()">Todas</button>
      <button class="filtro-btn" onclick="filtrarPorPerfume('Sauvage')">Sauvage</button>
      <button class="filtro-btn" onclick="filtrarPorPerfume('Yves Saint Laurent')">YSL</button>
      <button class="filtro-btn" onclick="filtrarPorPerfume('Egeo')">Egeo</button>
      <button class="filtro-btn" onclick="filtrarPorPerfume('Jean')">JeanPaulGautlier Lover</button>
    </div>

    <div class="lista-avaliacoes" id="listaAvaliacoes">
    </div>
  </div>
</body>

</html>
<script>

  if (sessionStorage.ID_USUARIO == undefined) {
    window.location.href = "../login.html";
  }

  let nomeUsuario = sessionStorage.NOME_USUARIO;

  if (nomeUsuario == undefined) {
    nomeUsuario = "Usuário";
  }

  document.getElementById("nomeUsuario").innerHTML = nomeUsuario;

  let avaliacoes = [];



  function criarEstrelas(nota) {

    let estrelas = "";

    for (let i = 1; i <= 5; i++) {

      if (i <= nota) {
        estrelas += "★";
      } else {
        estrelas += "☆";
      }
    }

    return estrelas;
  }



  function renderizarAvaliacoes(avaliacoes) {

    let container = document.getElementById("listaAvaliacoes");

    container.innerHTML = "";

    for (let i = 0; i < avaliacoes.length; i++) {

      container.innerHTML += `
      <div class="card-avaliacao">
        <div class="header-avaliacao">
          <h3>${avaliacoes[i].perfume}</h3>
          <div class="estrelas">
            ${criarEstrelas(avaliacoes[i].nota)}
          </div>
        </div>
        <p class="comentario">
          "${avaliacoes[i].comentario}"
        </p>
        <div class="footer-avaliacao">
          <span>
            Por: <strong>${avaliacoes[i].usuario}</strong>
          </span>
          <span>
            ${avaliacoes[i].data}
          </span>
        </div>
      </div>`;
    }
  }



  function filtrarTodas() {

    renderizarAvaliacoes(avaliacoes);

  }



  function filtrarPorPerfume(nome) {

    let filtradas = [];

    for (let i = 0; i < avaliacoes.length; i++) {

      if (avaliacoes[i].perfume.indexOf(nome) != -1) {

        filtradas.push(avaliacoes[i]);

      }
    }

    renderizarAvaliacoes(filtradas);
  }



  function carregarAvaliacoes() {

    fetch("/avaliacoes/listar")

      .then(function (resposta) {
        if (resposta.ok) {
          return resposta.json();
        } else {
          alert("Erro ao buscar avaliações");
        }

      })
      .then(function (dados) {
        avaliacoes = dados;
        renderizarAvaliacoes(avaliacoes);

      })

      .catch(function () {

        alert("Erro na aplicação");

      });

  }



  window.onload = carregarAvaliacoes;



  function sair() {

    sessionStorage.clear();

    window.location.href = "../login.html";

  }

</script>
