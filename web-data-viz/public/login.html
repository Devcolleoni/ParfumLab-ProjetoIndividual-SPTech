<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link rel="stylesheet" href="css/cadastro.css">
  <link rel="icon" href="imgs/bannerLogin.png">
</head>

<body>

  <div class="pagina-auth">

    <div class="fundo-escuro"></div>

    <div class="caixa-formulario">
      <h2 class="titulo-formulario">Login</h2>

      <form onsubmit="logar(); return false;">
        <input id="email" class="input-formulario" type="text" placeholder="Email">
        <input id="senha" class="input-formulario" type="password" placeholder="Senha">
        <button class="botao-formulario">Entrar</button>
      </form>

      <p id="mensagem" class="texto-formulario"></p>

      <p class="texto-formulario">
        Não tem conta?
        <a class="link-formulario" href="cadastro.html">Cadastre-se</a>
      </p>
    </div>

  </div>
</body>

</html>
<script>

  function logar() {

    let email = document.getElementById("email").value;
    let senha = document.getElementById("senha").value;


    if (email == "" || senha == "") {

      mensagem.innerHTML = "Preencha todos os campos!";
      mensagem.style.color = "red";
      return false;
    }

    


    fetch("/usuarios/autenticar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        emailServer: email,
        senhaServer: senha
      })
    }).then(function (resposta) {
        if (resposta.ok) {
          resposta.json()
            .then(function (dados) {
              sessionStorage.ID_USUARIO = dados.id;
              sessionStorage.NOME_USUARIO = dados.nome;
              sessionStorage.EMAIL_USUARIO = dados.email;
              mensagem.innerHTML = "Login realizado com sucesso!";
              mensagem.style.color = "green";
              setTimeout(function () {
                window.location = "dashboard/perfumes..html";
              }, 1000);

            });

        } else {

          mensagem.innerHTML = "Email ou senha inválidos!";

          mensagem.style.color = "red";

        }

      })

      .catch(function (erro) {
        console.log(erro);
        mensagem.innerHTML = "Erro na aplicação!";
        mensagem.style.color = "red";

      });



    return false;
  }

</script>
